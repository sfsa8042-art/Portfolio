</style></head><body>
<!-- PAGE 1 -->
<div class="page"><div class="page-accent"></div><div class="hdr"><div class="hdr-logo">N<span>F</span>Q</div><div class="hdr-sub">Compliance Report</div><div class="hdr-pg">1 / 3</div></div>
<div class="banner"><h1>Отчёт о результатах комплексного аудита</h1><div class="sub">Направления: ${dirLabels}</div><div class="banner-meta"><span>Объект: <strong>${c.name}${c.sub?', '+c.sub:''}</strong></span><span>Дата: <strong>${c.date}</strong></span><span>Локация: <strong>${c.addr||'г. Москва'}</strong></span><span>Формат: <strong>выездной аудит</strong></span><span>Статус: <strong>Final · Client Copy</strong></span></div></div>
<div class="row2"><div class="col-l"><div class="pcard"><h3>Параметры объекта</h3><div class="prow"><span class="prow-l">Тип</span><span class="prow-v">${c.type}${c.sub?', '+c.sub:''}</span></div><div class="prow"><span class="prow-l">Площадь</span><span class="prow-v">${c.area||'—'}</span></div><div class="prow"><span class="prow-l">Численность персонала</span><span class="prow-v">${c.staff||'—'} человек</span></div><div class="prow"><span class="prow-l">Отраслевой сегмент</span><span class="prow-v">${c.type}</span></div><div class="prow"><span class="prow-l">Направления проверки</span><span class="prow-v">${dirLabels}</span></div></div></div>
<div class="col-r"><div class="scard"><div class="scard-ring"><svg width="68" height="68" viewBox="0 0 68 68"><circle cx="34" cy="34" r="28" fill="none" stroke="#E5E7EB" stroke-width="7"/><circle cx="34" cy="34" r="28" fill="none" stroke="${c.score>=70?'#166534':c.score>=50?'#2563EB':'#991B1B'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${dashOffCur}" transform="rotate(-90 34 34)"/><text x="34" y="31" text-anchor="middle" font-family="Helvetica Neue,Arial" font-size="17" font-weight="900" fill="#1E3A5F">${c.score||'—'}</text><text x="34" y="42" text-anchor="middle" font-family="Helvetica Neue,Arial" font-size="5.5" font-weight="500" fill="#9CA3AF">из 100</text></svg></div><div><h3>NFQ Risk Score</h3><p>Агрегированный индекс нормативного соответствия. Рассчитывается по количеству, критичности и устранимости нарушений.</p><div class="ctx">Медиана по сегменту (Москва, 2025): 51 из 100</div><div class="scale"><span class="sc-r">0–40 критический</span><span class="sc-a">41–70 средний</span><span class="sc-g">71–100 соответствие</span></div></div></div></div></div>
<div class="rexp"><div class="rexp-left"><div class="rexp-lbl">Совокупная штрафная экспозиция</div><div class="rexp-num">до ${penStr} ₽</div><div class="rexp-note">при выявлении всех нарушений</div></div><div class="rexp-desc">Расчётная сумма при проверках трёх ведомств: МЧС — до ${(mchsPen/1000).toLocaleString('ru')} 000 ₽ (ст. 20.4 КоАП РФ), Роспотребнадзор — до ${(rpnPen/1000).toLocaleString('ru')} 000 ₽ (ст. 6.6 КоАП РФ), Роструд — до ${(rtPen/1000).toLocaleString('ru')} 000 ₽ (ст. 5.27.1 КоАП РФ). При повторном выявлении — кратное увеличение. Дополнительно: приостановление деятельности до 90 суток.</div></div>
<div class="exec"><div class="slabel">Резюме аудита</div>По результатам выездной проверки установлено наличие нарушений${(c.p1||0)>0?' по всем направлениям':' по отдельным направлениям'}. ${(c.p1||0)>0?'Критические отклонения зафиксированы в блоке пожарной безопасности и санитарного контроля.':''} Совокупный уровень нормативного соответствия оценивается как ${riskNom}. Все нарушения устранимы. Приведение объекта в соответствие осуществимо за 30 календарных дней.</div>
<div class="pillars">${dirs.includes('fire')?`<div class="pillar pil-fire"><div class="pil-tag">ПБ</div><div class="pil-h">Пожарная безопасность</div><div class="pil-score">${fireScore||'—'} <span class="pil-of">/ 40</span></div><div class="pil-level ${fireScore<25?'lv-h':fireScore<35?'lv-m':'lv-l'}">${fireScore<25?'Высокий риск':fireScore<35?'Средний риск':'Низкий риск'}</div></div>`:''} ${dirs.includes('san')?`<div class="pillar pil-san"><div class="pil-tag">СанПиН</div><div class="pil-h">Санитарные нормы</div><div class="pil-score">${sanScore||'—'} <span class="pil-of">/ 35</span></div><div class="pil-level ${sanScore<20?'lv-h':sanScore<30?'lv-m':'lv-l'}">${sanScore<20?'Высокий риск':sanScore<30?'Средний риск':'Низкий риск'}</div></div>`:''} ${dirs.includes('ot')?`<div class="pillar pil-ot"><div class="pil-tag">ОТ</div><div class="pil-h">Охрана труда</div><div class="pil-score">${otScore||'—'} <span class="pil-of">/ 25</span></div><div class="pil-level ${otScore<15?'lv-h':otScore<22?'lv-m':'lv-l'}">${otScore<15?'Высокий риск':otScore<22?'Средний риск':'Низкий риск'}</div></div>`:''}</div>
<div class="ri-block"><div class="ri-title">Интерпретация риска</div><div class="ri-grid"><div class="ri-item"><div class="ri-lbl">Вероятность проверки (12 мес.)</div><div class="ri-val ri-high">Высокая</div><div class="ri-note">${c.type} — приоритетная категория в 2026 г.</div></div><div class="ri-item"><div class="ri-lbl">Вероятность предписания</div><div class="ri-val ri-high">≈ ${probPresc}%</div><div class="ri-note">${c.p1||0} критических + ${c.p2||0} средних нарушений</div></div><div class="ri-item"><div class="ri-lbl">Положение в отрасли</div><div class="ri-val ri-mid">${riskNom[0].toUpperCase()+riskNom.slice(1)}</div><div class="ri-note">${c.score||'—'}/100 при медиане 51</div></div><div class="ri-item"><div class="ri-lbl">Устранимость</div><div class="ri-val ri-ok">100%</div><div class="ri-note">Без капитальных затрат, 30 дней</div></div></div><div class="ri-footer">Объект классифицирован в зоне ${riskGen} нормативного риска. Рекомендуется приоритетное устранение P1-нарушений в течение 7 дней.</div></div>
<div class="ac-block"><div class="ac-title">Выводы аудитора</div><div class="ac-item"><div class="ac-num">I.</div><div class="ac-text">Объект допущен к эксплуатации, однако его текущее нормативное состояние не обеспечивает устойчивого прохождения контрольно-надзорных мероприятий.</div></div><div class="ac-item"><div class="ac-num">II.</div><div class="ac-text">${(c.p1||0)>=2?'Выявленные нарушения пожарной безопасности носят системный характер.':'Выявленные нарушения носят локальный характер и устранимы без значительных затрат.'}</div></div><div class="ac-item"><div class="ac-num">III.</div><div class="ac-text">При полном выполнении плана корректирующих мероприятий прогнозный уровень соответствия достигает безопасной зоны (≥ 71 балл).</div></div></div>
<div class="ftr"><span class="ftr-l">NFQ · Отчёт о комплексном аудите</span><span class="ftr-c">Конфиденциально</span><span class="ftr-r">Ref: ${ref}</span></div></div>
<!-- PAGE 2 -->
<div class="page"><div class="page-accent"></div><div class="hdr"><div class="hdr-logo">N<span>F</span>Q</div><div class="hdr-sub">Compliance Report</div><div class="hdr-pg">2 / 3</div></div>
<div class="sec-title">Реестр выявленных нарушений</div><div class="sec-sub">${totalV} нарушений · ${dirs.length} направлени${dirs.length===1?'е':dirs.length<=4?'я':'й'} · Выездной аудит ${c.date}</div>
<table class="rtable"><thead><tr><th style="width:10%">Направл.</th><th style="width:26%">Описание нарушения</th><th style="width:8%">Уровень</th><th style="width:30%">Нормативные последствия</th><th style="width:7%">P</th></tr></thead><tbody>${viols.map(v=>`<tr><td><span class="ct ${v.ct}">${v.d}</span></td><td>${v.t}</td><td><span class="rb ${v.rb}">${v.lvl}</span></td><td>${v.cons}</td><td><span class="pb ${v.pb}">${v.p}</span></td></tr>`).join('')}</tbody></table>
<div class="cum"><div class="cum-left"><div class="cum-num">${penStr} ₽</div><div class="cum-lbl">совокупный штрафной риск</div></div><div class="cum-desc"><strong>Оценка максимального штрафного воздействия</strong> при одновременных проверках МЧС, Роспотребнадзора и Роструда. Без учёта: потеря выручки при приостановлении, судебные издержки, репутационный ущерб.</div></div>
<div class="anl"><h4>Характер нарушений</h4>Нарушения ${(c.p1||0)>=2?'пожарной безопасности носят системный характер':'имеют локальный характер'}. Отклонения по СанПиН ${(c.p1||0)>0?'устранимы за 1–2 рабочих дня':'минимальны'}. Пробелы в документации ОТ — формального характера, не требуют финансовых вложений.</div>
<div class="ftr"><span class="ftr-l">NFQ · Отчёт о комплексном аудите</span><span class="ftr-c">Конфиденциально</span><span class="ftr-r">Ref: ${ref}</span></div></div>
<!-- PAGE 3 -->
<div class="page"><div class="page-accent"></div><div class="hdr"><div class="hdr-logo">N<span>F</span>Q</div><div class="hdr-sub">Compliance Report</div><div class="hdr-pg">3 / 3</div></div>
<div class="sec-title">Рекомендуемые корректирующие мероприятия</div><div class="sec-sub">Матрица устранения · Дорожная карта 30 дней</div>
<table class="rtable"><thead><tr><th style="width:21%">Нарушение</th><th style="width:6%">P</th><th style="width:28%">Рекомендуемое действие</th><th style="width:15%">Ответственный</th><th style="width:7%">Срок</th></tr></thead><tbody>${viols.map(v=>`<tr><td>${v.t.length>50?v.t.slice(0,50)+'…':v.t}</td><td><span class="pb ${v.pb}">${v.p}</span></td><td>${v.act}</td><td>${v.resp}</td><td>${v.days}</td></tr>`).join('')}</tbody></table>
<div class="wk-grid"><div class="wk-card wk-1"><div class="wk-top wk-t1"></div><div class="wk-label">Неделя 1 · P1</div>${viols.filter(v=>v.p==='P1').slice(0,4).map(v=>`<div class="wk-item">${v.t.split(':')[0]||v.t.slice(0,35)}</div>`).join('')}</div><div class="wk-card wk-2"><div class="wk-top wk-t2"></div><div class="wk-label">Неделя 2 · P1–P2</div>${viols.filter(v=>v.p==='P2').slice(0,3).map(v=>`<div class="wk-item">${v.t.split(':')[0]||v.t.slice(0,35)}</div>`).join('')}</div><div class="wk-card wk-3"><div class="wk-top wk-t3"></div><div class="wk-label">Неделя 3 · P2–P3</div><div class="wk-item">Пересмотр инструкций ОТ</div><div class="wk-item">Утверждение документации</div><div class="wk-item">Ознакомление персонала</div></div><div class="wk-card wk-4"><div class="wk-top wk-t4"></div><div class="wk-label">Неделя 4 · Верификация</div><div class="wk-item">Внутренняя проверка</div><div class="wk-item">Фотофиксация результатов</div><div class="wk-item">Папка доказательств</div><div class="wk-item">Контрольный скоринг</div></div></div>
<div class="prog"><div class="prog-ring"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/><circle cx="36" cy="36" r="28" fill="none" stroke="#6EE7B7" stroke-width="7" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${dashOff}" transform="rotate(-90 36 36)"/><text x="36" y="33" text-anchor="middle" font-family="Helvetica Neue,Arial" font-size="18" font-weight="900" fill="#6EE7B7">${progScore}</text><text x="36" y="44" text-anchor="middle" font-family="Helvetica Neue,Arial" font-size="5.5" font-weight="500" fill="rgba(255,255,255,0.3)">из 100</text></svg></div><div class="prog-info"><h3><span class="delta">↑ +${delta}</span>&nbsp; Прогнозный NFQ Score: ${progScore} / 100</h3><p>При полном выполнении мероприятий объект переходит из зоны ${riskGen} риска (${c.score||'—'}) в зону нормативного соответствия (${progScore}). Готовность к проверкам — без существенных замечаний.</p></div></div>
<div class="out-grid"><div class="out-item"><div class="out-dot"></div><div class="out-text">Существенное снижение штрафной экспозиции по ${dirs.length} направлениям</div></div><div class="out-item"><div class="out-dot"></div><div class="out-text">Устранение оснований для приостановления деятельности</div></div><div class="out-item"><div class="out-dot"></div><div class="out-text">Обеспечение готовности к внеплановой проверке любого ведомства</div></div><div class="out-item"><div class="out-dot"></div><div class="out-text">Систематизация внутренней нормативной и кадровой документации</div></div></div>
<div class="closing"><div class="slabel">Заключение</div><p>В ходе аудита зафиксировано ${totalV} нарушений нормативных требований, из которых ${c.p1||0} классифицированы как критические. Совокупная штрафная экспозиция — до ${penStr} ₽. Все нарушения устранимы без капитальных затрат. Рекомендуемый срок — 30 дней. Прогнозный NFQ Risk Score: ${progScore} из 100 — зона нормативного соответствия.</p><div class="sign-grid"><div class="sign-col"><div class="sign-lbl">Подготовлено</div><div class="sign-val">Команда аудита NFQ</div></div><div class="sign-col"><div class="sign-lbl">Дата выпуска</div><div class="sign-val">${c.date||'—'}</div></div><div class="sign-col"><div class="sign-lbl">Референс</div><div class="sign-val">${ref}</div></div></div></div>
<div class="ftr"><span class="ftr-l">NFQ · Отчёт о комплексном аудите</span><span class="ftr-c">Конфиденциально</span><span class="ftr-r">Ref: ${ref}</span></div></div>
</body></html>`;
  return html;
};

/* ══════════ ROUTE ENGINE ══════════ */
const buildRoute=(empId,cases,workH=8)=>{const emp=EMP_CAP[empId]||{homeLatLng:[55.7558,37.6173],speed:30};const home={lat:emp.homeLatLng[0],lng:emp.homeLatLng[1]};
  let remaining=[...cases];const stops=[];let cur={lat:home.lat,lng:home.lng};let clock=9*60;const endMin=9*60+workH*60;
  while(remaining.length>0){let bestIdx=-1,bestScore=-Infinity;
    for(let i=0;i<remaining.length;i++){const c=remaining[i];const dist=haversine(cur.lat,cur.lng,c.lat,c.lng);const travelMin=Math.round(dist/emp.speed*60*1.4);const arrival=clock+travelMin;const depart=arrival+(c.estH||2.5)*60;if(depart>endMin+30)continue;/* skip if way over */
      const sla=computeSLA(c);const urgency=sla.sla==='red'?500:sla.sla==='yellow'?200:0;const score=urgency-travelMin*2;
      if(score>bestScore){bestScore=score;bestIdx=i}}
    if(bestIdx===-1)break;const c=remaining[bestIdx];const dist=haversine(cur.lat,cur.lng,c.lat,c.lng);const travelMin=Math.round(dist/emp.speed*60*1.4);
    const arrival=clock+travelMin;const depart=arrival+(c.estH||2.5)*60;
    stops.push({caseId:c.id,caseName:c.name,lat:c.lat,lng:c.lng,travelMin,arrivalMin:arrival,departMin:depart,estH:c.estH||2.5,dist:Math.round(dist*10)/10,sla:computeSLA(c),status:c.status});
    cur={lat:c.lat,lng:c.lng};clock=depart;remaining.splice(bestIdx,1)}
  const retDist=haversine(cur.lat,cur.lng,home.lat,home.lng);const retMin=Math.round(retDist/emp.speed*60*1.4);
  const totalMin=stops.length>0?stops[stops.length-1].departMin-9*60+retMin:0;const feasible=totalMin<=workH*60;
  return{stops,totalMin,retMin,feasible,home,empId,unrouted:remaining.map(c=>c.id),totalKm:Math.round((stops.reduce((s,st)=>s+st.dist,0)+retDist)*10)/10}};
const fmtMin=m=>{const h=Math.floor(m/60);const mm=Math.round(m%60);return `${h}:${String(mm).padStart(2,'0')}`};
const fmtClock=m=>`${Math.floor(m/60)}:${String(Math.round(m%60)).padStart(2,'0')}`;

/* ══════════ MAP VIEW (MapLibre GL + GeoJSON layers + Route Planning) ══════════ */
const validGeo=(c)=>c.lat&&c.lng&&c.lat>55.5&&c.lat<56.0&&c.lng>37.3&&c.lng<38.0;
const MapView=({cases,setPage,setSel})=>{const mapRef=React.useRef(null);const mapObj=React.useRef(null);const mapReady=React.useRef(false);const popupRef=React.useRef(null);
  const[filter,sFilter]=useState('all');const[selAud,sSelAud]=useState('a1');const[showRoute,sShowRoute]=useState(false);const[route,sRoute]=useState(null);const[hover,sHover]=useState(null);
  const stCol={new:'#64748B',assigned:'#0EA5E9',audit_ip:'#2563EB',pending_v:'#D97706',revision:'#DC2626',report_ready:'#7C3AED',delivered:'#059669',follow_up:'#7C3AED',recheck_ip:'#06B6D4',closed:'#9CA3AF'};
  const filtered=filter==='all'?cases.filter(validGeo):cases.filter(c=>validGeo(c)&&c.status===filter);
  const audCases=cases.filter(c=>c.auditor===selAud&&['assigned','audit_ip','revision'].includes(c.status)&&validGeo(c));
  /* Build route */
  useEffect(()=>{if(showRoute&&audCases.length>0)sRoute(buildRoute(selAud,audCases));else if(!showRoute)sRoute(null)},[showRoute,selAud,cases.length]);

  /* Build GeoJSON FeatureCollection from filtered cases */
  const buildFC=()=>({type:'FeatureCollection',features:filtered.map(c=>{const sla=computeSLA(c);const rIdx=route?.stops.findIndex(s=>s.caseId===c.id)??-1;return{type:'Feature',geometry:{type:'Point',coordinates:[c.lng,c.lat]},properties:{id:c.id,name:c.name,type:c.type,addr:c.addr||'',status:c.status,sla:sla.sla,slaRemain:sla.remain,slaColor:sla.color,score:c.score,color:stCol[c.status]||'#64748B',routeIdx:rIdx,label:rIdx>=0?String(rIdx+1):String(c.id)}}})});

  /* Safe layer helpers */
  const safeRemove=(map,layerId,sourceId)=>{try{if(map.getLayer(layerId))map.removeLayer(layerId)}catch(e){}try{if(map.getSource(sourceId))map.removeSource(sourceId)}catch(e){}};

  /* Map init */
  useEffect(()=>{if(!mapRef.current||mapObj.current)return;
    const map=new maplibregl.Map({container:mapRef.current,style:{version:8,sources:{'osm':{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OSM'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[37.618,55.751],zoom:10.5,attributionControl:false});
    map.addControl(new maplibregl.NavigationControl(),'top-right');
    popupRef.current=new maplibregl.Popup({closeButton:false,closeOnClick:false,maxWidth:'240px',offset:12});
    map.on('load',()=>{mapReady.current=true;
      /* Cases layer (GeoJSON circles — no DOM, no floating) */
      map.addSource('cases-src',{type:'geojson',data:buildFC()});
      map.addLayer({id:'cases-glow',type:'circle',source:'cases-src',filter:['==',['get','sla'],'red'],paint:{'circle-radius':14,'circle-color':'#DC2626','circle-opacity':0.15,'circle-blur':0.8}});
      map.addLayer({id:'cases-circle',type:'circle',source:'cases-src',paint:{'circle-radius':['case',['==',['get','sla'],'red'],9,['>=',['get','routeIdx'],0],9,7],'circle-color':['case',['>=',['get','routeIdx'],0],'#0F172A',['get','color']],'circle-stroke-width':['case',['>=',['get','routeIdx'],0],3,2.5],'circle-stroke-color':['case',['>=',['get','routeIdx'],0],'#3B82F6','#ffffff'],'circle-opacity':0.95}});
      map.addLayer({id:'cases-label',type:'symbol',source:'cases-src',layout:{'text-field':['get','label'],'text-size':9,'text-font':['Open Sans Bold','Arial Unicode MS Bold'],'text-allow-overlap':true},paint:{'text-color':'#ffffff'}});
      /* Home source (empty initially) */
      map.addSource('home-src',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map.addLayer({id:'home-circle',type:'circle',source:'home-src',paint:{'circle-radius':10,'circle-color':'#059669','circle-stroke-width':2.5,'circle-stroke-color':'#ffffff','circle-opacity':0.95}});
      map.addLayer({id:'home-label',type:'symbol',source:'home-src',layout:{'text-field':'🏠','text-size':12,'text-allow-overlap':true}});
      /* Route source (empty initially) */
      map.addSource('route-src',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]},properties:{}}});
      map.addLayer({id:'route-line',type:'line',source:'route-src',paint:{'line-color':'#2563EB','line-width':3,'line-dasharray':[2,1.5],'line-opacity':0.7}});
      /* Hover popup */
      map.on('mouseenter','cases-circle',e=>{map.getCanvas().style.cursor='pointer';const f=e.features[0];if(!f)return;const p=f.properties;popupRef.current.setLngLat(f.geometry.coordinates).setHTML(`<div style="font-family:DM Sans,sans-serif"><b style="font-size:12px">${p.name}</b><br><span style="font-size:10px;color:#6B7280">${p.type} · ${(p.addr||'').split(',').slice(-1)}</span><br><span style="display:inline-block;margin-top:3px;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;background:${p.color}18;color:${p.color}">${ST[p.status]?.l||p.status}</span> <span style="font-size:9px;font-weight:700;color:${p.slaColor}">SLA: ${p.slaRemain}</span>${p.score!=null&&p.score!=='null'?`<br><span style="font-size:10px">Score: <b>${p.score}</b></span>`:''}</div>`).addTo(map);sHover(p.id)});
      map.on('mouseleave','cases-circle',()=>{map.getCanvas().style.cursor='';popupRef.current.remove();sHover(null)});
      /* Click → navigate */
      map.on('click','cases-circle',e=>{const f=e.features?.[0];if(!f)return;const c=cases.find(x=>x.id===f.properties.id);if(c){setSel(c);setPage('case_detail')}});
    });
    mapObj.current=map;
    return()=>{map.remove();mapObj.current=null;mapReady.current=false}
  },[]);

  /* Update data when cases/filter/route changes (setData, NOT recreate layers) */
  useEffect(()=>{if(!mapReady.current||!mapObj.current)return;const map=mapObj.current;
    try{const src=map.getSource('cases-src');if(src)src.setData(buildFC())}catch(e){}
    /* Update route line */
    try{const rs=map.getSource('route-src');if(rs){if(route&&route.stops.length>0){const coords=[[route.home.lng,route.home.lat],...route.stops.map(s=>[s.lng,s.lat]),[route.home.lng,route.home.lat]];rs.setData({type:'Feature',geometry:{type:'LineString',coordinates:coords},properties:{}});map.setPaintProperty('route-line','line-color',route.feasible?'#2563EB':'#DC2626')}else{rs.setData({type:'Feature',geometry:{type:'LineString',coordinates:[]},properties:{}})}}}catch(e){}
    /* Update home marker */
    try{const hs=map.getSource('home-src');if(hs){if(route){hs.setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[route.home.lng,route.home.lat]},properties:{}}]})}else{hs.setData({type:'FeatureCollection',features:[]})}}}catch(e){}
  },[filtered.length,filter,route,cases]);

  return<div className="flex flex-1 overflow-hidden fade-in" style={{height:'calc(100vh - 48px)'}}>
    {/* Map */}
    <div className="flex-1 flex flex-col min-w-0">
      <div className="flex items-center justify-between px-4 py-2.5 bg-white border-b border-gray-200/80">
        <div className="flex items-center gap-2"><h2 className="text-[14px] font-extrabold text-slate-800">Карта объектов</h2><span className="text-[10px] text-gray-400">{filtered.length} объектов</span></div>
        <div className="flex items-center gap-2">
          <div className="flex gap-0.5 rounded-lg border border-gray-200 overflow-hidden text-[9px] font-bold">{[['all','Все'],['audit_ip','Аудит'],['pending_v','Верификация'],['revision','Доработка'],['new','Новые']].map(([k,v])=><button key={k} onClick={()=>sFilter(k)} className={`px-2 py-1 ${filter===k?'bg-slate-800 text-white':'text-gray-500 hover:bg-gray-50'}`}>{v}</button>)}</div>
          <div className="h-4 w-px bg-gray-200"/>
          <select value={selAud} onChange={e=>sSelAud(e.target.value)} className="text-[10px] font-bold border border-gray-200 rounded-lg px-2 py-1"><option value="a1">{USERS.a1.name}</option><option value="a2">{USERS.a2.name}</option></select>
          <button onClick={()=>sShowRoute(!showRoute)} className={`px-3 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1 ${showRoute?'bg-blue-600 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>{ic.activity({size:11})} {showRoute?'Скрыть маршрут':'Маршрут дня'}</button>
        </div>
      </div>
      <div ref={mapRef} className="flex-1" style={{minHeight:400}}/>
      {/* Legend */}
      <div className="flex items-center gap-3 px-4 py-2 bg-white border-t border-gray-200/80 flex-wrap">{[['audit_ip','Аудит','#2563EB'],['pending_v','Верификация','#D97706'],['revision','Доработка','#DC2626'],['new','Новый','#64748B'],['report_ready','Отчёт','#7C3AED'],['delivered','Передан','#059669']].map(([s,l,cl])=><div key={s} className="flex items-center gap-1 text-[9px] text-gray-500"><div className="w-2.5 h-2.5 rounded-full" style={{background:cl}}/>{l} <b>{cases.filter(c=>c.status===s).length}</b></div>)}</div>
    </div>
    {/* Side Panel — Route Planner */}
    {showRoute&&<div className="w-[300px] bg-white border-l border-gray-200/80 flex-shrink-0 flex flex-col overflow-hidden">
      <div className="p-3 border-b border-gray-100">
        <div className="flex items-center justify-between mb-2"><h3 className="text-[13px] font-extrabold text-slate-800">Маршрут дня</h3><button onClick={()=>sShowRoute(false)} className="text-gray-400 hover:text-gray-600">{ic.x({size:14})}</button></div>
        <div className="flex items-center gap-2 text-[10px]"><div className="w-5 h-5 rounded-full bg-emerald-100 flex items-center justify-center text-[8px]">🏠</div><span className="text-gray-500">{USERS[selAud]?.name}</span></div>
      </div>
      {route&&route.stops.length>0?<>
        {/* Stats bar */}
        <div className="grid grid-cols-3 gap-1 p-3 border-b border-gray-100">
          <div className="text-center"><div className="text-[8px] text-gray-400 font-bold uppercase">Объектов</div><div className="text-[15px] font-black text-slate-800">{route.stops.length}</div></div>
          <div className="text-center"><div className="text-[8px] text-gray-400 font-bold uppercase">Время</div><div className="text-[15px] font-black text-slate-800">{fmtMin(route.totalMin)}</div></div>
          <div className="text-center"><div className="text-[8px] text-gray-400 font-bold uppercase">Км</div><div className="text-[15px] font-black text-slate-800">{route.totalKm}</div></div>
        </div>
        {/* Feasibility */}
        {!route.feasible&&<div className="mx-3 mt-2 p-2 rounded-lg bg-red-50 border border-red-200 flex items-start gap-1.5">{ic.alertTri({size:12,className:'text-red-500 mt-0.5 flex-shrink-0'})}<div><p className="text-[10px] font-bold text-red-800">Маршрут не укладывается</p><p className="text-[9px] text-red-600">Общее время {fmtMin(route.totalMin)} превышает 8ч рабочего дня</p></div></div>}
        {route.unrouted.length>0&&<div className="mx-3 mt-1.5 p-2 rounded-lg bg-amber-50 border border-amber-200 text-[9px] text-amber-700 font-semibold">{ic.alertCir({size:10,className:'inline mr-1'})} {route.unrouted.length} кейсов не вошли в маршрут</div>}
        {/* Stops list */}
        <div className="flex-1 overflow-y-auto p-3 space-y-0">
          {route.stops.map((st,i)=>{const slaCol=st.sla.sla==='red'?'border-red-300 bg-red-50/50':st.sla.sla==='yellow'?'border-amber-200 bg-amber-50/30':'border-gray-200';return<div key={st.caseId}>
            {/* Travel segment */}
            {<div className="flex items-center gap-2 py-1"><div className="w-5 flex justify-center"><div className="w-0.5 h-5 bg-blue-200"/></div><div className="text-[9px] text-blue-500 font-semibold">{st.travelMin} мин · {st.dist} км</div></div>}
            {/* Stop card */}
            <div className={`rounded-lg border p-2.5 cursor-pointer hover:shadow-sm transition-all ${slaCol}`} onClick={()=>{const c=cases.find(x=>x.id===st.caseId);if(c){setSel(c);setPage('case_detail')}}}>
              <div className="flex items-center gap-2 mb-1">
                <div className="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center text-[9px] font-black text-white flex-shrink-0">{i+1}</div>
                <div className="flex-1 min-w-0"><div className="text-[11px] font-bold text-slate-800 truncate">{st.caseName}</div></div>
                <SlaB c={cases.find(x=>x.id===st.caseId)||{status:'new',_slaStart:Date.now()}}/>
              </div>
              <div className="flex items-center gap-3 text-[9px] text-gray-500 ml-7">
                <span>Прибытие: <b className="text-slate-700">{fmtClock(st.arrivalMin)}</b></span>
                <span>Длит.: <b className="text-slate-700">{st.estH}ч</b></span>
                <span>Выезд: <b className="text-slate-700">{fmtClock(st.departMin)}</b></span>
              </div>
            </div>
          </div>})}
          {/* Return home */}
          <div className="flex items-center gap-2 py-1"><div className="w-5 flex justify-center"><div className="w-0.5 h-5 bg-blue-200"/></div><div className="text-[9px] text-blue-500 font-semibold">{route.retMin} мин · возврат 🏠</div></div>
          <div className="rounded-lg border border-emerald-200 bg-emerald-50/50 p-2 text-center"><div className="text-[10px] font-bold text-emerald-700">Возврат в {fmtClock((route.stops.length>0?route.stops[route.stops.length-1].departMin:9*60)+route.retMin)}</div></div>
        </div>
        {/* Actions */}
        <div className="p-3 border-t border-gray-100 space-y-1.5">
          <button onClick={()=>{sRoute(buildRoute(selAud,audCases))}} className="w-full py-2 rounded-lg text-[11px] font-bold bg-slate-800 text-white hover:bg-slate-700 flex items-center justify-center gap-1.5">{ic.refresh({size:12})} Переоптимизировать</button>
        </div>
      </>:<div className="flex-1 flex items-center justify-center p-5"><div className="text-center"><p className="text-[12px] text-gray-400 font-semibold">Нет активных кейсов</p><p className="text-[10px] text-gray-400 mt-1">для {USERS[selAud]?.name}</p></div></div>}
    </div>}
  </div>};

/* ══════════ WEEKLY LOAD (real forecast) ══════════ */
const WeeklyLoad=({cases})=>{const emps=['a1','a2','v1'];const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const[detailCell,sDetailCell]=useState(null);
  /* Count warnings */
  const unplanned=cases.filter(c=>c.plannedDay==null&&!['delivered','closed','follow_up'].includes(c.status));
  return<div className="p-5 max-w-[1100px] fade-in"><h2 className="text-[18px] font-extrabold text-slate-800 mb-1">Загрузка команды</h2><p className="text-[12px] text-gray-400 mb-4">Прогноз на текущую неделю · на основе {cases.filter(c=>c.plannedDay!=null).length} запланированных кейсов</p>
    {unplanned.length>0&&<div className="mb-3 p-2.5 rounded-xl bg-amber-50 border border-amber-200 flex items-start gap-2">{ic.alertTri({size:14,className:'text-amber-500 mt-0.5 flex-shrink-0'})}<div><p className="text-[11px] font-bold text-amber-800">{unplanned.length} кейсов без запланированной даты</p><p className="text-[9px] text-amber-600">{unplanned.map(c=>c.name).join(', ')}</p></div></div>}
    <div className="bg-white rounded-xl border border-gray-200/80 overflow-hidden"><table className="w-full text-[11px]"><thead><tr className="bg-gray-50 text-[9px] text-gray-500 uppercase tracking-wider font-bold"><th className="text-left px-3 py-2.5 w-28">Сотрудник</th>{days.map(d=><th key={d} className="px-2 py-2.5 text-center w-20">{d}</th>)}</tr></thead><tbody className="divide-y divide-gray-100">{emps.map(eid=>{const u=USERS[eid];return<tr key={eid}><td className="px-3 py-3"><div className="font-bold text-slate-800">{u.name.split(' ')[0]}</div><div className="text-[9px] text-gray-400">{u.role==='auditor'?'Аудитор':u.role==='verifier'?'Верификатор':'Менеджер'}</div></td>{days.map((d,di)=>{const dl=calcDayLoad(eid,cases,di);const isWeekend=di>=5;if(isWeekend)return<td key={d} className="px-2 py-3 text-center"><span className="text-[10px] text-gray-300">—</span></td>;const cellKey=eid+'-'+di;const isOpen=detailCell===cellKey;
  return<td key={d} className="px-2 py-3 text-center relative"><div className={`rounded-lg border p-1.5 cursor-pointer hover:shadow-sm transition-all ${LOAD_COL[dl.status]} ${dl.warnings.length>0?'ring-1 ring-amber-300':''}`} onClick={()=>sDetailCell(isOpen?null:cellKey)}><div className="text-[13px] font-black">{dl.total}ч</div><div className="text-[9px] font-bold">{dl.pct}%</div>{dl.cases.length>0&&<div className="text-[8px] opacity-60">{dl.cases.length} кейс{dl.cases.length>1?'а':''}</div>}</div>
  {/* Detail popup */}
  {isOpen&&<div className="absolute z-20 top-full left-1/2 -translate-x-1/2 mt-1 w-52 bg-white rounded-xl border border-gray-200 shadow-xl p-3 text-left" onClick={e=>e.stopPropagation()}><div className="text-[10px] font-bold text-slate-800 mb-2">{u.name.split(' ')[0]} · {d}</div><div className="space-y-1 text-[9px]">{dl.auditH>0&&<div className="flex justify-between"><span className="text-gray-500">Аудит на объектах</span><b className="text-slate-700">{dl.auditH}ч</b></div>}{dl.travelH>0&&<div className="flex justify-between"><span className="text-gray-500">Дорога</span><b className="text-slate-700">{dl.travelH}ч</b></div>}{dl.verifyH>0&&<div className="flex justify-between"><span className="text-gray-500">Верификация</span><b className="text-slate-700">{dl.verifyH}ч</b></div>}{dl.reportH>0&&<div className="flex justify-between"><span className="text-gray-500">Отчёты</span><b className="text-slate-700">{dl.reportH}ч</b></div>}<div className="flex justify-between border-t border-gray-100 pt-1 mt-1"><span className="text-gray-500">Админ</span><b className="text-slate-700">{dl.adminH}ч</b></div><div className="flex justify-between border-t border-gray-100 pt-1 mt-1"><span className="text-gray-700 font-bold">Итого</span><b className="text-slate-800">{dl.total}ч / {dl.cap}ч</b></div></div>{dl.warnings.length>0&&<div className="mt-2 p-1.5 rounded bg-amber-50 text-[8px] text-amber-700">{dl.warnings.join('; ')}</div>}{dl.cases.length>0&&<div className="mt-2 text-[8px] text-gray-400">Кейсы: {dl.cases.map(id=>'#'+id).join(', ')}</div>}</div>}
  </td>})}</tr>})}</tbody></table></div>
    <div className="flex gap-3 mt-3 text-[9px]">{[['underload','< 30%','Недогрузка'],['normal','30–85%','Норма'],['high','85–100%','Высокая'],['overload','> 100%','Перегрузка']].map(([s,r,l])=><div key={s} className={`flex items-center gap-1.5 px-2 py-1 rounded border ${LOAD_COL[s]}`}><span className="font-bold">{r}</span> {l}</div>)}</div>
    {/* Employee summary cards */}
    <div className="mt-4 grid grid-cols-3 gap-3">{emps.map(eid=>{const u=USERS[eid];const l=calcLoad(eid,cases);const weekWarnings=[];for(let d=0;d<5;d++){const dl=calcDayLoad(eid,cases,d);weekWarnings.push(...dl.warnings)};return<div key={eid} className="bg-white rounded-xl border p-4"><div className="flex items-center justify-between mb-2"><span className="text-[12px] font-bold text-slate-800">{u.name}</span><span className={`text-[9px] font-bold px-2 py-0.5 rounded ${LOAD_COL[l.status]}`}>{l.pct}% avg</span></div><div className="h-2 bg-gray-100 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:Math.min(100,l.pct)+'%',background:l.status==='overload'?'#DC2626':l.status==='high'?'#D97706':'#059669'}}/></div><div className="mt-2 grid grid-cols-3 gap-1 text-[9px] text-gray-500"><div>Аудит <b className="text-slate-700">{l.auditH}ч</b></div><div>Верификация <b className="text-slate-700">{l.verifyH}ч</b></div><div>Отчёты <b className="text-slate-700">{l.reportH}ч</b></div></div>{weekWarnings.length>0&&<div className="mt-2 p-1.5 rounded bg-amber-50 border border-amber-200 text-[8px] text-amber-700">{ic.alertTri({size:9,className:'inline mr-0.5'})}{[...new Set(weekWarnings)].slice(0,2).join('; ')}</div>}</div>})}</div>
  </div>};

/* ══════════ STATIC PAGES ══════════ */
const LogPage=()=><div className="p-5 max-w-[800px] fade-in"><h2 className="text-[18px] font-extrabold text-slate-800 mb-4">Журнал</h2><div className="bg-white rounded-xl border divide-y divide-gray-50">{LOG.map((a,i)=><div key={i} className="px-4 py-3 flex items-center gap-3"><div className={`w-1.5 h-1.5 rounded-full ${({start:'bg-blue-500',submit:'bg-amber-500',verify:'bg-emerald-500',return:'bg-red-500',create:'bg-indigo-500',deliver:'bg-violet-500'})[a.t]||'bg-gray-400'}`}/><div className="flex-1"><p className="text-[12px] text-slate-700"><b>{a.user}</b> {a.act.toLowerCase()}</p><p className="text-[10px] text-gray-400">{a.obj}</p></div><span className="text-[10px] text-gray-400">{a.time}</span></div>)}</div></div>;
const AIPage=()=><div className="p-5 max-w-[800px] fade-in"><h2 className="text-[18px] font-extrabold text-slate-800 mb-4">AI Ассистент</h2><div className="bg-violet-50 border border-violet-200 rounded-xl p-4 mb-4"><div className="flex items-start gap-2">{ic.bot({size:18,className:'text-violet-600 mt-0.5'})}<p className="text-[12px] text-violet-900">AI анализирует данные аудитов. <b>Не принимает решений</b>.</p></div></div><div className="grid grid-cols-2 gap-3">{[{ik:'alertTri',c:'text-amber-500',t:'Общепит',x:'73% — товарное соседство.'},{ik:'flame',c:'text-red-500',t:'Сезонный риск',x:'МЧС: проверки весной.'},{ik:'camera',c:'text-violet-500',t:'Фото',x:'14% — низкое качество.'},{ik:'activity',c:'text-emerald-500',t:'Динамика',x:'Score: 62→68.'}].map((t,i)=><div key={i} className="bg-white rounded-xl border p-4"><div className="flex items-center gap-1.5 mb-1.5">{ic[t.ik]({size:14,className:t.c})}<span className="text-[12px] font-bold text-slate-800">{t.t}</span></div><p className="text-[11px] text-gray-500">{t.x}</p></div>)}</div></div>;
const CreateCase=({setCases,setPage})=>{const[name,sN]=useState('');const[type,sT]=useState('');const[addr,sA]=useState('');const[pkg,sP]=useState('complex');const doCreate=()=>{if(!name)return;setCases(p=>[...p,{id:Date.now(),name,type:type||'—',sub:'',addr:addr||'—',pkg,risk:'medium',score:null,compl:0,status:'new',manager:'m1',auditor:null,verifier:null,date:new Date().toLocaleDateString('ru'),deadline:'—',p1:null,p2:null,p3:null,inn:'—',area:'—',staff:0,clientStatus:'not_started',lat:55.75+Math.random()*0.04-0.02,lng:37.62+Math.random()*0.08-0.04,_slaStart:Date.now(),estH:2.5,plannedDay:null}]);setPage('cases')};return<div className="p-5 max-w-[600px] fade-in"><button onClick={()=>setPage('cases')} className="flex items-center gap-1 text-[10px] text-gray-400 mb-3">{ic.chevL({size:12})} Назад</button><h2 className="text-[18px] font-extrabold text-slate-800 mb-4">Новый кейс</h2><div className="bg-white rounded-xl border p-5 space-y-4"><div><label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1">Объект *</label><input value={name} onChange={e=>sN(e.target.value)} placeholder='Кафе «Название»' className="w-full px-3 py-2 border rounded-xl text-[12px] focus:outline-none focus:ring-2 focus:ring-blue-200"/></div><div className="grid grid-cols-2 gap-3"><div><label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1">Тип</label><input value={type} onChange={e=>sT(e.target.value)} placeholder="Общепит" className="w-full px-3 py-2 border rounded-xl text-[12px] focus:outline-none focus:ring-2 focus:ring-blue-200"/></div><div><label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1">Адрес</label><input value={addr} onChange={e=>sA(e.target.value)} placeholder="Москва, ул.." className="w-full px-3 py-2 border rounded-xl text-[12px] focus:outline-none focus:ring-2 focus:ring-blue-200"/></div></div><div><label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Пакет</label><div className="grid grid-cols-3 gap-2">{Object.entries(PKG).filter(([k])=>k!=='recheck').map(([k,v])=><button key={k} onClick={()=>sP(k)} className={`p-2.5 rounded-xl border text-center transition-all ${pkg===k?`${v.color} ring-2 ring-offset-1`:'border-gray-200 hover:bg-gray-50'}`}><span className="text-[11px] font-bold block">{v.short}</span>{v.premium&&<span className="text-[8px] text-indigo-600 font-bold">★</span>}</button>)}</div></div><p className="text-[10px] text-gray-400">Аудитор и верификатор назначаются после создания.</p><button onClick={doCreate} disabled={!name} className={`w-full py-2.5 rounded-xl text-[13px] font-bold ${name?'bg-slate-800 text-white':'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>{ic.plus({size:14})} Создать кейс</button></div></div>};

/* ══════════ MAIN APP ══════════ */
function App(){
  const[user,setUser]=useState(null);const[page,setPage]=useState('dashboard');const[sel,setSel]=useState(null);const[cases,setCases]=useState(initCases);
  const updateCase=(id,patch)=>{setCases(prev=>prev.map(x=>x.id===id?{...x,...patch}:x));setSel(prev=>prev&&prev.id===id?{...prev,...patch}:prev)};
  if(!user)return<Login onLogin={u=>{setUser(u);setPage('dashboard')}}/>;
  const r=user.role;
  const titles={dashboard:{t:r==='manager'?'Операционная панель':r==='auditor'?'Главная':'Контроль качества'},cases:{t:r==='manager'?'Кейсы':'Мои кейсы'},case_detail:{t:sel?.name||'Кейс'},create_case:{t:'Новый кейс'},assign_case:{t:'Назначение'},audit_exec:{t:sel?.name||'Аудит'},verification:{t:'Очередь'},verify_detail:{t:sel?.name||'Проверка'},recheck:{t:'Re-check'},followup:{t:'Follow-up'},map:{t:'Карта объектов'},load:{t:'Загрузка команды'},ai:{t:'AI'},log:{t:'Журнал'}};const ti=titles[page]||{t:page};
  const render=()=>{switch(page){
    case 'dashboard':return r==='manager'?<ManagerDash cases={cases} setPage={setPage} setSel={setSel} updateCase={updateCase}/>:r==='auditor'?<AuditorDash cases={cases} user={user} setPage={setPage} setSel={setSel}/>:<VerifierDash cases={cases} setPage={setPage} setSel={setSel}/>;
    case 'cases':case 'verified_list':return<CasesList cases={cases} setPage={setPage} setSel={setSel} user={user}/>;
    case 'case_detail':return<CaseDetail c={sel} updateCase={updateCase} setPage={setPage} setSel={setSel} user={user}/>;
    case 'create_case':return<CreateCase setCases={setCases} setPage={setPage}/>;
    case 'assign_case':return<AssignCase c={sel} updateCase={updateCase} setPage={setPage}/>;
    case 'audit_exec':return<AuditExec c={sel} updateCase={updateCase} setPage={setPage} user={user}/>;
    case 'verification':return<VerifierDash cases={cases} setPage={setPage} setSel={setSel}/>;
    case 'verify_detail':return<VerifyDetail c={sel} updateCase={updateCase} setPage={setPage}/>;
    case 'recheck':return<RecheckScreen c={sel} updateCase={updateCase} setPage={setPage}/>;
    case 'map':return<MapView cases={cases} setPage={setPage} setSel={setSel}/>;
    case 'load':return<WeeklyLoad cases={cases}/>;
    case 'followup':return<div className="p-5 max-w-[1100px] fade-in"><h2 className="text-[18px] font-extrabold text-slate-800 mb-4">Follow-up кейсы</h2><div className="space-y-3">{cases.filter(c=>c.status==='follow_up').map(c=><div key={c.id} className="bg-white rounded-xl border p-4 cursor-pointer hover:shadow-sm" onClick={()=>{setSel(c);setPage('case_detail')}}><div className="flex items-center gap-3"><div className="flex-1"><span className="text-[13px] font-bold text-slate-800">{c.name}</span><div className="text-[10px] text-gray-400 mt-0.5">{c.type} · {PKG[c.pkg].l}</div></div><span className={`text-[10px] font-bold px-2 py-0.5 rounded ${CLIENT_ST[c.clientStatus||'not_started']?.c}`}>{CLIENT_ST[c.clientStatus||'not_started']?.l}</span><StatusB s={c.status}/>{ic.chevR({size:14,className:'text-gray-300'})}</div></div>)}{!cases.filter(c=>c.status==='follow_up').length&&<p className="text-center text-gray-400 py-8">Нет активных follow-up</p>}</div></div>;
    case 'ai':return<AIPage/>;case 'log':return<LogPage/>;
    default:return r==='manager'?<ManagerDash cases={cases} setPage={setPage} setSel={setSel} updateCase={updateCase}/>:r==='auditor'?<AuditorDash cases={cases} user={user} setPage={setPage} setSel={setSel}/>:<VerifierDash cases={cases} setPage={setPage} setSel={setSel}/>;
  }};
  return(<div className="flex h-screen overflow-hidden" style={{background:'#F7F8FA'}}><Sidebar page={page} setPage={setPage} user={user} onLogout={()=>{setUser(null);setPage('dashboard')}}/><div className="flex-1 flex flex-col min-w-0 overflow-hidden"><TopBar title={ti.t} sub={ti.s}/><main className={`flex-1 overflow-auto ${['audit_exec','verify_detail','map'].includes(page)?'flex':''}`}>{render()}</main></div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
