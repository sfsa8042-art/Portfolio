/* ══════════ CONFIG ══════════ */
const PKG={fire_only:{l:'Пожарная безопасность',short:'ПБ',blocks:['fire'],premium:false,color:'bg-red-100 text-red-700 border-red-200'},san_only:{l:'СанПиН',short:'СанПиН',blocks:['san'],premium:false,color:'bg-amber-100 text-amber-700 border-amber-200'},ot_only:{l:'Охрана труда',short:'ОТ',blocks:['ot'],premium:false,color:'bg-emerald-100 text-emerald-700 border-emerald-200'},complex:{l:'Комплексный 3-в-1',short:'3-в-1',blocks:['fire','san','ot'],premium:false,color:'bg-blue-100 text-blue-700 border-blue-200'},premium:{l:'Premium 3-в-1',short:'Premium',blocks:['fire','san','ot'],premium:true,color:'bg-indigo-100 text-indigo-700 border-indigo-200'},recheck:{l:'Повторная проверка',short:'Re-check',blocks:['fire','san','ot'],premium:false,color:'bg-cyan-100 text-cyan-700 border-cyan-200'}};
const ST={new:{l:'Новый',c:'bg-slate-100 text-slate-600',d:'bg-slate-400'},assigned:{l:'Назначен',c:'bg-sky-50 text-sky-700',d:'bg-sky-500'},audit_ip:{l:'Аудит',c:'bg-blue-50 text-blue-700',d:'bg-blue-500'},pending_v:{l:'На верификации',c:'bg-amber-50 text-amber-700',d:'bg-amber-500'},revision:{l:'На доработке',c:'bg-red-50 text-red-700',d:'bg-red-500'},report_ready:{l:'Отчёт готов',c:'bg-indigo-50 text-indigo-700',d:'bg-indigo-500'},delivered:{l:'Передан',c:'bg-emerald-50 text-emerald-700',d:'bg-emerald-500'},follow_up:{l:'Follow-up',c:'bg-violet-50 text-violet-700',d:'bg-violet-500'},recheck_ip:{l:'Re-check',c:'bg-cyan-50 text-cyan-700',d:'bg-cyan-500'},closed:{l:'Закрыт',c:'bg-gray-100 text-gray-500',d:'bg-gray-400'}};
/* NFQ-SCR-6.2: 5-level risk scale */
const RISK={critical:{l:'Критический',c:'text-red-800 bg-red-100 border-red-300',dot:'#991B1B'},high:{l:'Высокий',c:'text-red-700 bg-red-50 border-red-200',dot:'#DC2626'},medium:{l:'Средний',c:'text-amber-700 bg-amber-50 border-amber-200',dot:'#D97706'},moderate:{l:'Умеренный',c:'text-blue-700 bg-blue-50 border-blue-200',dot:'#2563EB'},low:{l:'Низкий',c:'text-emerald-700 bg-emerald-50 border-emerald-200',dot:'#059669'}};
/* NFQ-SCR-6.2: score→risk level */
const scoreRisk=s=>s==null?'medium':s<=29?'critical':s<=49?'high':s<=69?'medium':s<=89?'moderate':'low';
/* NFQ-SCR-6.1: Score formula — weights ПБ:0.40, СанПиН:0.35, ОТ:0.25 */
const SCORE_W={fire:0.40,san:0.35,ot:0.25};
/* NFQ-SCR-6.4: штрафная экспозиция by direction (max per violation, ₽) */
const PENALTY_MAP={fire:{p1:200000,p2:40000,p3:15000,label:'ст. 20.4 КоАП'},san:{p1:130000,p2:40000,p3:20000,label:'ст. 6.6 КоАП'},ot:{p1:130000,p2:80000,p3:30000,label:'ст. 5.27.1 КоАП'}};
const calcPenalty=(p1,p2,p3)=>(p1||0)*130000+(p2||0)*35000+(p3||0)*15000;

/* ══════════ OPS MODULE: SLA + GEO + LOAD ══════════ */
const SLA_RULES={new:{stage:'Назначение',maxH:4,yellow:0.7,next:['assigned']},assigned:{stage:'Старт аудита',maxH:24,yellow:0.7,next:['audit_ip','recheck_ip']},audit_ip:{stage:'Аудит',maxH:48,yellow:0.7,next:['pending_v']},pending_v:{stage:'Верификация',maxH:24,yellow:0.7,next:['revision','report_ready']},revision:{stage:'Доработка',maxH:24,yellow:0.7,next:['pending_v']},report_ready:{stage:'Передача отчёта',maxH:48,yellow:0.7,next:['delivered']},recheck_ip:{stage:'Re-check',maxH:72,yellow:0.7,next:['closed','follow_up']}};
const CASE_GEO={1:{lat:55.7644,lng:37.6057},2:{lat:55.7520,lng:37.5910},3:{lat:55.7036,lng:37.5849},4:{lat:55.7524,lng:37.5853},5:{lat:55.6498,lng:37.6924},6:{lat:55.7620,lng:37.6340},7:{lat:55.7694,lng:37.6775},8:{lat:55.7414,lng:37.6262}};
const EMP_CAP={a1:{capH:8,maxCases:3,homeLatLng:[55.7832,37.5913],speed:30},a2:{capH:8,maxCases:3,homeLatLng:[55.7150,37.6510],speed:25},v1:{capH:8,maxCases:8,homeLatLng:[55.7340,37.5880],speed:25},m1:{capH:8,maxCases:10,homeLatLng:[55.7558,37.6173],speed:30}};
/* a1: Белорусская (55.7832,37.5913), a2: Нагатинская (55.7150,37.6510), v1: Ленинский (55.7340,37.5880), m1: центр */
/* SLA Engine: compute SLA status for a case */
const computeSLA=(c)=>{const rule=SLA_RULES[c.status];if(!rule||['delivered','follow_up','closed'].includes(c.status))return{sla:'done',stage:'—',pct:0,remain:'—',color:'gray'};const now=Date.now();const created=c._slaStart||now;const elapsedH=(now-created)/(3600000);const pct=Math.min(100,elapsedH/rule.maxH*100);const remainH=Math.max(0,rule.maxH-elapsedH);const h=Math.floor(remainH);const m=Math.round((remainH-h)*60);const remain=remainH<=0?'просрочен':h+'ч '+m+'м';const sla=pct>=100?'red':pct>=rule.yellow*100?'yellow':'green';return{sla,stage:rule.stage,pct:Math.round(pct),remain,color:sla==='red'?'#DC2626':sla==='yellow'?'#D97706':'#059669',maxH:rule.maxH,elapsedH:Math.round(elapsedH*10)/10}};
const SLA_COL={green:'bg-emerald-100 text-emerald-700',yellow:'bg-amber-100 text-amber-700',red:'bg-red-100 text-red-700',done:'bg-gray-100 text-gray-400'};
const SlaB=({c})=>{const s=computeSLA(c);return<span className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold ${SLA_COL[s.sla]}`} title={`${s.stage}: ${s.remain}`}>{s.sla==='red'?'●':s.sla==='yellow'?'◐':'○'} {s.remain}</span>};
/* Generate alerts from current cases */
const getAlerts=(cases)=>{const alerts=[];cases.forEach(c=>{const s=computeSLA(c);if(s.sla==='red')alerts.push({id:'sla-r-'+c.id,sev:'critical',title:c.name,msg:`SLA нарушен: ${s.stage} просрочен`,caseId:c.id});else if(s.sla==='yellow')alerts.push({id:'sla-y-'+c.id,sev:'warning',title:c.name,msg:`SLA предупреждение: ${s.stage} — ${s.remain} осталось`,caseId:c.id});if(c.status==='new'&&!c.auditor)alerts.push({id:'unassign-'+c.id,sev:'warning',title:c.name,msg:'Кейс не назначен',caseId:c.id})});return alerts.sort((a,b)=>a.sev==='critical'?-1:b.sev==='critical'?1:0)};
/* Load calculation — production model */
/* Time norms (hours) */
const LOAD_NORMS={audit_buffer:0.5,travel_per_case:0.5,verify_case:0.75,revision_review:0.5,report_review:0.5,report_gen:1.0,admin_daily:0.5,recheck_factor:0.6};
/* Calculate load for one employee on one specific day (0=Mon..4=Fri) */
const calcDayLoad=(empId,cases,dayIdx)=>{const emp=USERS[empId];const cap=(EMP_CAP[empId]||{capH:8}).capH;
  if(dayIdx>=5)return{total:0,cap:0,pct:0,auditH:0,travelH:0,verifyH:0,reportH:0,adminH:0,status:'weekend',cases:[],warnings:[]};
  const role=emp?.role;const warnings=[];
  /* Filter cases that affect this employee on this day */
  const dayCases=cases.filter(c=>{
    if(c.plannedDay==null)return false;/* skip unplanned */
    if(c.plannedDay!==dayIdx)return false;
    /* Completed statuses don't generate load */
    if(['delivered','closed','follow_up'].includes(c.status))return false;
    /* Role match */
    if(role==='auditor')return c.auditor===empId;
    if(role==='verifier')return c.verifier===empId;
    if(role==='manager')return c.manager===empId;
    return false;
  });
  let auditH=0,travelH=0,verifyH=0,reportH=0,adminH=LOAD_NORMS.admin_daily;
  const caseIds=[];
  dayCases.forEach(c=>{
    caseIds.push(c.id);
    if(!c.estH)warnings.push(`#${c.id} ${c.name}: нет estH`);
    if(role==='auditor'){
      if(['new','assigned','audit_ip'].includes(c.status)){
        auditH+=(c.estH||2.5)+LOAD_NORMS.audit_buffer;travelH+=LOAD_NORMS.travel_per_case;
      }else if(c.status==='revision'){
        auditH+=(c.estH||2.5)*LOAD_NORMS.recheck_factor+LOAD_NORMS.audit_buffer;travelH+=LOAD_NORMS.travel_per_case;
      }else if(c.status==='recheck_ip'){
        auditH+=(c.estH||1.5)*LOAD_NORMS.recheck_factor+LOAD_NORMS.audit_buffer;travelH+=LOAD_NORMS.travel_per_case;
      }
    }else if(role==='verifier'){
      if(c.status==='pending_v')verifyH+=LOAD_NORMS.verify_case;
      else if(c.status==='revision')verifyH+=LOAD_NORMS.revision_review;
      else if(c.status==='report_ready')reportH+=LOAD_NORMS.report_review;
    }else if(role==='manager'){
      if(c.status==='report_ready')reportH+=LOAD_NORMS.report_gen;
      else if(c.status==='new')adminH+=0.25;/* assignment overhead */
    }
  });
  /* Unplanned cases warning */
  const unplanned=cases.filter(c=>c.plannedDay==null&&!['delivered','closed','follow_up'].includes(c.status)&&(
    (role==='auditor'&&c.auditor===empId)||(role==='verifier'&&c.verifier===empId)));
  if(unplanned.length>0&&dayIdx===0)warnings.push(`${unplanned.length} кейсов без даты`);
  const total=Math.round((auditH+travelH+verifyH+reportH+adminH)*10)/10;
  const pct=cap>0?Math.round(total/cap*100):0;
  return{total,cap,pct,auditH:Math.round(auditH*10)/10,travelH:Math.round(travelH*10)/10,verifyH:Math.round(verifyH*10)/10,reportH:Math.round(reportH*10)/10,adminH:Math.round(adminH*10)/10,status:pct>110?'overload':pct>85?'high':pct<30?'underload':'normal',cases:caseIds,warnings}};
/* Aggregate weekly load (for dashboard mini-bars) */
const calcLoad=(empId,cases)=>{let totH=0,totAudit=0,totVerify=0,totReport=0,days=0;
  for(let d=0;d<5;d++){const dl=calcDayLoad(empId,cases,d);totH+=dl.total;totAudit+=dl.auditH;totVerify+=dl.verifyH;totReport+=dl.reportH;if(dl.total>0)days++}
  const avgH=days>0?Math.round(totH/days*10)/10:0;const cap=(EMP_CAP[empId]||{capH:8}).capH;const pct=cap>0?Math.round(avgH/cap*100):0;

d rounded-xl hover:bg-slate-700 mb-4">Войти</button><div className="border-t border-gray-100 pt-4"><p className="text-[10px] text-gray-400 uppercase tracking-wider font-bold text-center mb-3">Демо-вход</p><div className="grid grid-cols-3 gap-2">{[['m1','Менеджер','briefcase','bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100'],['a1','Аудитор','clipboard','bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'],['v1','Верификатор','userCheck','bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100']].map(([uid,lbl,ik,cls])=><button key={uid} onClick={()=>onLogin(USERS[uid])} className={`p-3 rounded-xl border text-center transition-all ${cls}`}>{ic[ik]({size:18,className:'mx-auto mb-1'})}<span className="text-[11px] font-bold block">{lbl}</span><span className="text-[9px] opacity-70">{USERS[uid].name}</span></button>)}</div></div></div></div></div>)};

const Sidebar=({page,setPage,user,onLogout})=>{const r=user.role;const nav=r==='manager'?[['home','Главная','dashboard'],['folder','Кейсы','cases'],['building','Карта','map'],['barChart','Загрузка','load'],['refresh','Follow-up','followup']]:r==='auditor'?[['home','Главная','dashboard'],['clipboard','Мои кейсы','cases']]:[['home','Главная','dashboard'],['userCheck','Очередь','verification'],['clipboard','Проверенные','cases']];const badges=r==='auditor'?{cases:'1'}:r==='verifier'?{verification:'2'}:{};return(<aside className="w-[220px] flex-shrink-0 flex flex-col overflow-hidden" style={{background:'#0F172A'}}><div className="px-4 pt-4 pb-2 flex items-center gap-2"><span style={{fontWeight:900,fontSize:22,letterSpacing:-2,color:'#fff',lineHeight:1}}>N<span style={{color:'#EF4444'}}>F</span>Q</span><div className="flex flex-col"><span style={{fontSize:7,color:'rgba(255,255,255,0.3)',fontWeight:700,letterSpacing:2,textTransform:'uppercase',lineHeight:1}}>Expert</span><span style={{fontSize:7,color:'rgba(255,255,255,0.3)',fontWeight:700,letterSpacing:2,textTransform:'uppercase',lineHeight:1}}>OS</span></div></div><div className="px-3 pb-2"><div className="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-widest text-center" style={{background:'rgba(255,255,255,0.06)',color:r==='manager'?'#60A5FA':r==='auditor'?'#34D399':'#FBBF24'}}>{r==='manager'?'Менеджер':r==='auditor'?'Аудитор':'Верификатор'}</div></div><div className="h-px mx-3 mb-1" style={{background:'rgba(255,255,255,0.06)'}}/><nav className="flex-1 px-3 py-1 space-y-0.5 overflow-y-auto">{nav.map(([ik,lbl,pg])=><SBI key={pg} ik={ik} label={lbl} active={page===pg||(['assign_case','case_detail'].includes(page)&&pg==='cases')} onClick={()=>setPage(pg)} badge={badges[pg]}/>)}<div className="pt-4 pb-1"><span className="text-[8px] text-slate-600 font-bold uppercase tracking-[2px] px-3">Инструменты</span></div><SBI ik="bot" label="AI" active={page==='ai'} onClick={()=>setPage('ai')}/><SBI ik="history" label="Журнал" active={page==='log'} onClick={()=>setPage('log')}/></nav><div className="p-3 mx-3 mb-2 rounded-lg" style={{background:'rgba(255,255,255,0.04)'}}><div className="flex items-center gap-2"><div className="w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-bold text-white" style={{background:'rgba(255,255,255,0.12)'}}>{user.short}</div><div className="flex-1 min-w-0"><div className="text-[11px] font-semibold text-slate-200 truncate">{user.name}</div><div className="text-[9px] text-slate-500">{user.title}</div></div><button onClick={onLogout} className="text-slate-500 hover:text-slate-300" title="Выйти">{ic.logOut({size:14})}</button></div></div></aside>)};

/* ══════════ #6+#7 MANAGER DASH with risk insights & pipeline guard ══════════ */

    <div className="grid grid-cols-4 gap-3">{stats.map((s,i)=><div key={i} className="bg-white rounded-xl border border-gray-200/80 p-3.5"><div className="flex items-center justify-between mb-2"><span className="text-[10px] text-gray-500 font-semibold uppercase tracking-wide">{s.l}</span><div className="p-1.5 rounded-lg" style={{background:s.bg}}>{ic[s.ik]({size:14,style:{color:s.ac}})}</div></div><div className="text-[24px] font-black text-slate-800 leading-none">{s.v}</div></div>)}</div>
    {/* SLA ALERTS + TEAM LOAD */}
    <div className="grid grid-cols-5 gap-3">
      <div className="col-span-3 bg-white rounded-xl border border-gray-200/80 p-4"><div className="flex items-center justify-between mb-3"><div className="flex items-center gap-2">{ic.alertTri({size:14,className:'text-red-500'})}<h3 className="text-[13px] font-bold text-slate-800">SLA Алерты</h3>{alerts.length>0&&<span className="bg-red-500 text-white text-[9px] font-bold rounded-full px-1.5 py-0.5">{alerts.length}</span>}</div></div><div className="space-y-1.5 max-h-[180px] overflow-y-auto">{alerts.length>0?alerts.slice(0,6).map(a=><div key={a.id} className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer hover:shadow-sm ${a.sev==='critical'?'bg-red-50 border border-red-200':'bg-amber-50 border border-amber-200'}`} onClick={()=>{const c=cases.find(c=>c.id===a.caseId);if(c){setSel(c);setPage('case_detail')}}}><div className={`w-2 h-2 rounded-full flex-shrink-0 ${a.sev==='critical'?'bg-red-500':'bg-amber-500'}`}/><div className="flex-1 min-w-0"><div className="text-[11px] font-semibold text-slate-800 truncate">{a.title}</div><div className="text-[9px] text-gray-500">{a.msg}</div></div>{ic.chevR({size:12,className:'text-gray-300 flex-shrink-0'})}</div>):<div className="text-center py-6 text-gray-400 text-[12px]">{ic.checkCir({size:24,className:'mx-auto mb-1 opacity-40'})}Нет активных алертов</div>}</div></div>
      <div className="col-span-2 bg-white rounded-xl border border-gray-200/80 p-4"><div className="flex items-center justify-between mb-3"><h3 className="text-[13px] font-bold text-slate-800">Загрузка команды</h3><button onClick={()=>setPage('load')} className="text-[10px] text-blue-600 font-bold hover:underline">Подробнее</button></div><div className="space-y-2">{['a1','a2','v1'].map(eid=>{const u=USERS[eid];const l=calcLoad(eid,cases);return<div key={eid} className="flex items-center gap-2"><span className="text-[10px] font-semibold text-slate-700 w-16 truncate">{u.name.split(' ')[0]}</span><div className="flex-1 h-3 bg-gray-100 rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:Math.min(100,l.pct)+'%',background:l.status==='overload'?'#DC2626':l.status==='high'?'#D97706':'#059669'}}/></div><span className={`text-[10px] font-bold w-10 text-right ${l.status==='overload'?'text-red-600':l.status==='high'?'text-amber-600':'text-emerald-600'}`}>{l.pct}%</span></div>})}</div></div>
    </div>
    {critical.length>0&&<div className="bg-red-50 border border-red-200 rounded-xl p-4"><div className="flex items-center gap-2 mb-3">{ic.alertTri({size:16,className:'text-red-500'})}<h3 className="text-[13px] font-bold text-red-800">Критические объекты ({critical.length})</h3></div><div className="space-y-2">{critical.map(c=>{const reasons=[];if(c.score!=null&&c.score<60)reasons.push('низкий Score');if(c.risk==='high')reasons.push('высокий риск');if(c.p1>=3)reasons.push(c.p1+' крит. нарушений');return<div key={c.id} className="flex items-center gap-3 p-2.5 bg-white rounded-lg border border-red-100 cursor-pointer hover:shadow-sm" onClick={()=>{setSel(c);setPage('case_detail')}}><ScoreC score={c.score} size={32}/><div className="flex-1"><span className="text-[12px] font-semibold text-slate-800">{c.name}</span><div className="text-[10px] text-red-600">{reasons.join(' · ')}</div></div><SlaB c={c}/><StatusB s={c.status}/></div>})}</div></div>}
    <div className="bg-white rounded-xl border border-gray-200/80 p-4"><h3 className="text-[13px] font-bold text-slate-800 mb-3">Pipeline</h3><div className="flex gap-2">{[['new','Новые'],['assigned','Назначен'],['audit_ip','Аудит'],['pending_v','Верификация'],['revision','Доработка'],['report_ready','Отчёт'],['delivered','Передан'],['follow_up','Follow-up'],['closed','Закрыт']].map(([st,lbl])=><div key={st} className="flex-1 p-2 rounded-xl bg-gray-50 border border-gray-200/80 text-center"><div className="text-[16px] font-black text-slate-800">{cases.filter(c=>c.status===st).length}</div><div className="text-[8px] text-gray-500 font-semibold">{lbl}</div></div>)}</div></div>
    <div className="bg-white rounded-xl border border-gray-200/80 overflow-hidden"><div className="px-4 py-3 border-b border-gray-100"><h3 className="text-[13px] font-bold text-slate-800">Все кейсы</h3></div><table className="w-full text-[12px]"><thead><tr className="bg-gray-50/80 text-[9px] text-gray-500 uppercase tracking-wider font-bold"><th className="text-left px-3 py-2">Объект</th><th className="px-3 py-2">Пакет</th><th className="px-3 py-2">Статус</th><th className="px-3 py-2">SLA</th><th className="px-3 py-2">Score</th><th className="px-3"></th></tr></thead><tbody className="divide-y divide-gray-50">{[...cases].sort((a,b)=>{const sa=computeSLA(a),sb=computeSLA(b);const ord={red:0,yellow:1,green:2,done:3};return(ord[sa.sla]??3)-(ord[sb.sla]??3)}).map(c=><tr key={c.id} className="hover:bg-gray-50/80 cursor-pointer" onClick={()=>{setSel(c);setPage('case_detail')}}><td className="px-3 py-2.5"><div className="font-semibold text-slate-800">{c.name}</div><div className="text-[10px] text-gray-400">{c.addr}</div></td><td className="px-3 py-2.5 text-center"><PkgB p={c.pkg}/></td><td className="px-3 py-2.5"><StatusB s={c.status}/></td><td className="px-3 py-2.5"><SlaB c={c}/></td><td className="px-3 py-2.5 text-center"><ScoreC score={c.score} size={28}/></td><td className="px-3">{ic.chevR({size:14,className:'text-gray-300'})}</td></tr>)}</tbody></table></div>
  </div>)};

/* ══════════ AUDITOR DASH ══════════ */
const AuditorDash=({cases,user,setPage,setSel})=>{const my=cases.filter(c=>c.auditor===user.id);const active=my.filter(c=>['audit_ip','assigned','revision'].includes(c.status));const stats=[{l:'Активные',v:active.length,ik:'clipboard',ac:'#2563EB',bg:'#EFF6FF'},{l:'На доработке',v:my.filter(c=>c.status==='revision').length,ik:'rotateCcw',ac:'#DC2626',bg:'#FEF2F2'},{l:'На проверке',v:my.filter(c=>c.status==='pending_v').length,ik:'clock',ac:'#D97706',bg:'#FFFBEB'},{l:'Завершено',v:my.filter(c=>['delivered','report_ready','follow_up','closed'].includes(c.status)).length,ik:'checkCir',ac:'#059669',bg:'#F0FDF4'}];return(<div className="p-5 space-y-4 max-w-[1100px] fade-in"><div><h2 className="text-[18px] font-extrabold text-slate-800">Добро пожаловать, {user.name.split(' ')[0]}</h2></div><div className="grid grid-cols-4 gap-3">{stats.map((s,i)=><div key={i} className="bg-white rounded-xl border border-gray-200/80 p-3.5"><div className="flex items-center justify-between mb-2"><span className="text-[10px] text-gray-500 font-semibold uppercase tracking-wide">{s.l}</span><div className="p-1.5 rounded-lg" style={{background:s.bg}}>{ic[s.ik]({size:14,style:{color:s.ac}})}</div></div><div className="text-[24px] font-black text-slate-800 leading-none">{s.v}</div></div>)}</div><div className="grid grid-cols-5 gap-3"><div className="col-span-3 bg-white rounded-xl border border-gray-200/80"><div className="px-4 py-3 border-b border-gray-100"><h3 className="text-[13px] font-bold text-slate-800">Мои задачи</h3></div><div className="divide-y divide-gray-50">{active.map(c=><div key={c.id} className="px-4 py-3 flex items-center gap-3 hover:bg-gray-50 cursor-pointer" onClick={()=>{setSel(c);setPage(c.isRecheck?'recheck':'audit_exec')}}><div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{background:RISK[c.risk].dot+'12'}}>{ic.building({size:14,style:{color:RISK[c.risk].dot}})}</div><div className="flex-1 min-w-0"><div className="flex items-center gap-2"><span className="text-[12px] font-semibold text-slate-800 truncate">{c.name}</span><StatusB s={c.status}/><PkgB p={c.pkg}/>{c.isRecheck&&<span className="text-[8px] font-bold text-cyan-700 bg-cyan-100 px-1.5 py-0.5 rounded border border-cyan-200">Re-check</span>}</div><div className="text-[10px] text-gray-400">{c.type} · {c.date}{c.status==='revision'&&<span className="text-red-500 font-semibold ml-1">← доработка</span>}</div></div><ScoreC score={c.score} size={32}/>{ic.chevR({size:14,className:'text-gray-300'})}</div>)}{!active.length&&<div className="text-center py-8 text-gray-400 text-[12px]">Нет активных задач</div>}</div></div><div className="col-span-2"><div className="bg-white rounded-xl border border-gray-200/80 p-4"><div className="flex items-center gap-2 mb-2">{ic.sparkles({size:13,className:'text-violet-500'})}<span className="text-[12px] font-bold text-slate-800">AI Инсайты</span></div><div className="space-y-2"><AIChip type="warning">Фитнес «Атлант» — 3 пункта на доработке.</AIChip><AIChip type="info">73% общепита: товарное соседство (S1).</AIChip></div></div></div></div></div>)};

/* ══════════ VERIFIER DASH ══════════ */

        {user.role==='manager'&&<div className="bg-white rounded-xl border border-gray-200/80 p-4 space-y-2"><h3 className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-2">Действия</h3>

          {c.status==='delivered'&&canTransit('follow_up')&&<button onClick={()=>guardedUpdate('follow_up')} className="w-full py-2 rounded-xl text-[12px] font-bold bg-violet-600 text-white hover:bg-violet-700 flex items-center justify-center gap-2">{ic.refresh({size:13})} Follow-up</button>}

        </div>}
        {user.role==='auditor'&&c.auditor===user.id&&['audit_ip','revision','assigned'].includes(c.status)&&<button onClick={()=>{setSel(c);setPage(c.isRecheck?'recheck':'audit_exec')}} className="w-full py-2 rounded-xl text-[12px] font-bold bg-slate-800 text-white hover:bg-slate-700 flex items-center justify-center gap-2">{c.isRecheck?ic.refresh({size:13}):ic.clipboard({size:13})} {c.isRecheck?'Начать повторную проверку':'Открыть аудит'}</button>}
      </div>
    </div>}
    {tab==='audit'&&<div className="bg-white rounded-xl border p-6 text-center py-12">{['audit_ip','revision','assigned'].includes(c.status)&&c.auditor===user.id?(c.isRecheck?<button onClick={()=>{setSel(c);setPage('recheck')}} className="px-6 py-2.5 bg-cyan-700 text-white text-[13px] font-bold rounded-xl">Начать повторную проверку</button>:<button onClick={()=>{setSel(c);setPage('audit_exec')}} className="px-6 py-2.5 bg-slate-800 text-white text-[13px] font-bold rounded-xl">Открыть аудит</button>):['pending_v','report_ready','delivered','follow_up'].includes(c.status)?<div className="text-gray-500 text-[13px]">{ic.lock({size:24,className:'mx-auto mb-2 text-amber-500'})}Аудит заблокирован ({ST[c.status]?.l})</div>:c.status==='new'?<p className="text-[12px] text-gray-400">Назначьте команду</p>:<p className="text-[12px] text-gray-400">Аудит завершён</p>}</div>}
    {tab==='violations'&&<div className="space-y-4">
      <div className="bg-white rounded-xl border border-gray-200/80 p-4"><h3 className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-3">Реестр нарушений · NFQ-RPT-8.0</h3>{c.p1!=null?<div className="space-y-2">{[
        {d:'ПБ',t:'Огнетушитель ОП-4: срок перезарядки истёк, акт отсутствует',p:'P1',npa:'ст. 20.4 КоАП',fine:'до 200 000 ₽',act:'Перезарядка / замена → акт → запись в журнал'},

        {d:'ПБ',t:'Проход к запасному выходу частично перекрыт складскими коробками',p:'P1',npa:'СП 1.13130.2020',fine:'до 150 000 ₽',act:'Освобождение прохода → разметка'},
        {d:'СанПиН',t:'Мясная и молочная продукция в одном отсеке холодильной камеры',p:'P1',npa:'ТР ТС 021/2011',fine:'до 130 000 ₽',act:'Реорганизация зон хранения → маркировка'},
        {d:'СанПиН',t:'3 контейнера без маркировки: нет наименования, даты, срока',p:'P2',npa:'ТР ТС 022/2011',fine:'Замечание',act:'Нанесение этикеток → чек-лист приёмки'},

        {d:'ОТ',t:'У 2 сотрудников нет подтверждения вводного инструктажа',p:'P3',npa:'Пр. Минтруда №2464н',fine:'Замечание',act:'Повторный инструктаж → фиксация подписей'}
      ].slice(0,(c.p1||0)+(c.p2||0)+(c.p3||0)).map((v,i)=><div key={i} className="flex items-start gap-2 p-2.5 rounded-lg bg-gray-50 border border-gray-200/80"><div className="flex flex-col items-center gap-1 flex-shrink-0 w-10"><span className={`text-[8px] font-bold px-1.5 py-0.5 rounded ${v.p==='P1'?'bg-red-100 text-red-700':v.p==='P2'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700'}`}>{v.p}</span><span className="text-[7px] font-bold text-gray-400">{v.d}</span></div><div className="flex-1 min-w-0"><p className="text-[11px] text-slate-800 font-semibold">{v.t}</p><p className="text-[9px] text-gray-400 mt-0.5"><span className="font-mono">{v.npa}</span> · <span className="text-red-500">{v.fine}</span></p><p className="text-[9px] text-blue-600 mt-0.5">→ {v.act}</p></div></div>)}</div>:<p className="text-[12px] text-gray-400">Аудит не проведён</p>}</div>

/* ══════════ ASSIGN CASE ══════════ */
const AssignCase=({c,updateCase,setPage})=>{const[aud,sAud]=useState(c?.auditor||'');const[ver,sVer]=useState(c?.verifier||'v1');if(!c)return null;const isRC=!!c.isRecheck||c.status==='follow_up';const doAssign=()=>{if(!aud)return;updateCase(c.id,{auditor:aud,verifier:ver,status:'assigned',isRecheck:isRC});setPage('case_detail')};return(<div className="p-5 max-w-[600px] fade-in"><button onClick={()=>setPage('case_detail')} className="flex items-center gap-1 text-[10px] text-gray-400 mb-3">{ic.chevL({size:12})} К кейсу</button><h2 className="text-[18px] font-extrabold text-slate-800 mb-1">{isRC?'Назначение повторной проверки':'Назначение команды'}</h2><p className="text-[12px] text-gray-400 mb-4">{c.name} · {PKG[c.pkg].l}</p>{isRC&&<div className="mb-4 p-3 rounded-xl bg-cyan-50 border border-cyan-200 flex items-center gap-2">{ic.refresh({size:16,className:'text-cyan-700'})}<div><p className="text-[12px] font-bold text-cyan-800">Повторная проверка</p><p className="text-[10px] text-cyan-600">Назначение аудитора для re-check выявленных нарушений</p></div></div>}<div className="bg-white rounded-xl border border-gray-200/80 p-5 space-y-4"><div className="flex items-center gap-3 p-3 rounded-xl bg-gray-50 border border-gray-200"><div className="flex-1"><div className="text-[12px] font-bold text-slate-800">{c.name}</div><div className="text-[10px] text-gray-400">{c.type} · {c.addr}</div></div><PkgB p={c.pkg}/>{isRC&&<span className="text-[9px] font-bold text-cyan-700 bg-cyan-100 border border-cyan-200 px-2 py-0.5 rounded">Re-check</span>}</div><div><label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Аудитор *</label><select value={aud} onChange={e=>sAud(e.target.value)} className="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-[12px] focus:outline-none focus:ring-2 focus:ring-blue-200"><option value="">Выберите аудитора</option><option value="a1">{USERS.a1.name}</option><option value="a2">{USERS.a2.name}</option></select></div><div><label className="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Верификатор</label><select value={ver} onChange={e=>sVer(e.target.value)} className="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-[12px] focus:outline-none focus:ring-2 focus:ring-blue-200"><option value="v1">{USERS.v1.name}</option></select></div><button onClick={doAssign} disabled={!aud} className={`w-full py-2.5 rounded-xl text-[13px] font-bold flex items-center justify-center gap-2 ${aud?(isRC?'bg-cyan-600 text-white hover:bg-cyan-700':'bg-sky-600 text-white hover:bg-sky-700'):'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>{ic.userPlus({size:14})} {isRC?'Назначить и запустить re-check':'Назначить и передать в работу'}</button></div></div>)};

/* ══════════ #1: ENHANCED FOLLOW-UP PANEL ══════════ */

/* ══════════ #2: ENHANCED RE-CHECK ══════════ */
const RecheckScreen=({c,updateCase,setPage})=>{
  const totalViol=(c?.p1||0)+(c?.p2||0)+(c?.p3||0);
  const mockViols=[{id:'rc1',text:'Огнетушитель ОП-4 просрочен',pri:'P1',block:'ПБ',oldPhoto:true},{id:'rc2',text:'План эвакуации не обновлён',pri:'P1',block:'ПБ',oldPhoto:true},{id:'rc3',text:'Проход к выходу перекрыт',pri:'P1',block:'ПБ',oldPhoto:true},{id:'rc4',text:'Нарушение товарного соседства',pri:'P1',block:'СанПиН',oldPhoto:true},{id:'rc5',text:'Контейнеры без маркировки',pri:'P2',block:'СанПиН'},{id:'rc6',text:'Журнал инструктажа отсутствует',pri:'P2',block:'ОТ'},{id:'rc7',text:'Инструкции не пересмотрены',pri:'P2',block:'ОТ'},{id:'rc8',text:'Нет подписей 2 сотрудников',pri:'P3',block:'ОТ'}].slice(0,Math.max(totalViol,3));
  const[statuses,sS]=useState({});const[photos,sP]=useState({});const[comments,sC]=useState({});const[done,sD]=useState(false);
  /* #2: validation — not_fixed needs photo, partial needs comment */
  const getErrors=()=>{const e=[];mockViols.forEach(v=>{if(!statuses[v.id])e.push({id:v.id,msg:'Статус не указан'});if(statuses[v.id]==='not_fixed'&&!photos[v.id])e.push({id:v.id,msg:'Фото обязательно для неустранённых'});if(statuses[v.id]==='partial'&&!comments[v.id])e.push({id:v.id,msg:'Комментарий обязателен при частичном устранении'})});return e};
  const errs=getErrors();const allDone=errs.length===0;
  const fixedCount=mockViols.filter(v=>statuses[v.id]==='fixed').length;
  const allFixed=fixedCount===mockViols.length;

  if(done){return<div className="flex-1 flex items-center justify-center bg-gray-50 p-5 fade-in"><div className="text-center max-w-sm"><div className="w-14 h-14 rounded-full bg-cyan-100 flex items-center justify-center mx-auto mb-3">{ic.checkCir({size:28,className:'text-cyan-600'})}</div><h2 className="text-lg font-extrabold text-slate-800 mb-1">Повторная проверка завершена</h2><p className="text-[12px] text-gray-500 mb-2">{c?.name}</p><p className="text-[12px] text-emerald-700 font-bold mb-4">Устранено: {fixedCount}/{mockViols.length}</p><div className="bg-white rounded-xl border p-4 mb-4 text-left"><div className="text-[10px] text-gray-400 font-bold uppercase mb-2">Результат</div><div className="space-y-1">{mockViols.map(v=><div key={v.id} className="flex items-center gap-2 text-[11px]"><span className={`font-bold ${statuses[v.id]==='fixed'?'text-emerald-600':statuses[v.id]==='partial'?'text-amber-600':'text-red-600'}`}>{statuses[v.id]==='fixed'?'✓':statuses[v.id]==='partial'?'◐':'✗'}</span><span className="text-gray-600">{v.text}</span></div>)}</div></div><button onClick={()=>setPage('cases')} className="px-5 py-2 bg-slate-800 text-white text-[12px] font-bold rounded-lg">К кейсам</button></div></div>}

  return(<div className="p-5 max-w-[900px] fade-in"><button onClick={()=>setPage('cases')} className="flex items-center gap-1 text-[10px] text-gray-400 mb-3">{ic.chevL({size:12})} Назад</button><div className="flex items-center gap-3 mb-4"><div className="p-2 rounded-lg bg-cyan-50 border border-cyan-200">{ic.refresh({size:18,className:'text-cyan-700'})}</div><div><h2 className="text-[17px] font-extrabold text-slate-800">Повторная проверка</h2><p className="text-[12px] text-gray-400">{c?.name} · {mockViols.length} нарушений</p></div></div>
    <div className="space-y-3">{mockViols.map(v=>{const st=statuses[v.id];const needPhoto=st==='not_fixed'&&!photos[v.id];const needComment=st==='partial'&&!comments[v.id];return(<div key={v.id} className="bg-white rounded-xl border border-gray-200/80 p-4"><div className="flex items-center gap-2 mb-2"><span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${v.pri==='P1'?'bg-red-100 text-red-700':v.pri==='P2'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700'}`}>{v.pri}</span><span className="text-[9px] font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">{v.block}</span>{needPhoto&&<span className="text-[9px] font-bold text-red-500 bg-red-50 px-1.5 py-0.5 rounded">⚠ Нужно фото</span>}{needComment&&<span className="text-[9px] font-bold text-amber-500 bg-amber-50 px-1.5 py-0.5 rounded">⚠ Комментарий</span>}</div><p className="text-[13px] font-semibold text-slate-800 mb-3">{v.text}</p><div className="flex items-start gap-4"><div className="flex-1">{v.oldPhoto&&<div className="mb-2 p-2 rounded-lg bg-gray-50 border flex items-center gap-2"><div className="w-10 h-10 rounded bg-gray-200 flex items-center justify-center">{ic.img({size:14,className:'text-gray-400'})}</div><span className="text-[10px] text-gray-500">Фото первичного аудита</span></div>}<div className="flex gap-1.5 mb-2">{[['fixed','Устранено','bg-emerald-600'],['partial','Частично','bg-amber-500'],['not_fixed','Не устранено','bg-red-600']].map(([val,lbl,clr])=><button key={val} onClick={()=>sS(p=>({...p,[v.id]:val}))} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all ${st===val?`${clr} text-white ring-2 ring-offset-1`:'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>{lbl}</button>)}</div><textarea placeholder={needComment?'⚠ Комментарий обязателен...':'Комментарий...'} rows={1} value={comments[v.id]||''} onChange={e=>sC(p=>({...p,[v.id]:e.target.value}))} className={`w-full text-[11px] border rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 resize-none ${needComment?'border-amber-300 bg-amber-50/50 focus:ring-amber-200 placeholder-amber-500':'border-gray-200 focus:ring-blue-200'}`}/></div><div className="w-28 flex-shrink-0">{photos[v.id]?<div className="relative"><div className="w-full aspect-square rounded-lg bg-emerald-50 border-2 border-emerald-200 flex flex-col items-center justify-center">{ic.img({size:18,className:'text-emerald-500'})}<span className="text-[9px] text-emerald-700 font-bold">Новое фото</span></div><button onClick={()=>sP(p=>{const n={...p};delete n[v.id];return n})} className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white rounded-full flex items-center justify-center">{ic.x({size:8})}</button></div>:<button onClick={()=>sP(p=>({...p,[v.id]:true}))} className={`w-full aspect-square rounded-lg border-2 border-dashed flex flex-col items-center justify-center gap-0.5 transition-all ${needPhoto?'border-red-300 bg-red-50/50 text-red-400 pulse-b':'border-gray-200 text-gray-400 hover:bg-gray-50'}`}>{ic.upload({size:16})}<span className="text-[9px] font-bold">Новое фото</span></button>}</div></div></div>)})}</div>
    <div className="mt-4"><button onClick={()=>{if(!allDone)return;const newStatus=allFixed?'closed':'follow_up';updateCase(c.id,{status:newStatus,score:Math.min(100,(c?.score||50)+fixedCount*3)});sD(true)}} disabled={!allDone} className={`w-full py-2.5 rounded-xl text-[13px] font-bold flex items-center justify-center gap-2 ${allDone?'bg-cyan-700 text-white hover:bg-cyan-800':'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>{ic.checkCir({size:14})} Завершить re-check</button>{!allDone&&<p className="text-[10px] text-red-500 text-center mt-1">{errs.length} незакрытых замечаний</p>}</div>
  </div>)};

/* ══════════ #3,4,5,8: AUDIT EXEC ══════════ */
const AuditExec=({c,updateCase,setPage,user})=>{
  /* #8: extended lock for pending_v + report_ready + delivered + follow_up */
  const LOCKED=['pending_v','report_ready','delivered','follow_up','closed','recheck_ip'];
  if(LOCKED.includes(c?.status)||c?.isRecheck)return<div className="flex-1 flex items-center justify-center bg-gray-50 p-5 fade-in"><div className="text-center max-w-sm">{c?.isRecheck?ic.refresh({size:40,className:'mx-auto mb-3 text-cyan-500'}):ic.lock({size:40,className:'mx-auto mb-3 text-amber-500'})}<h2 className="text-lg font-extrabold text-slate-800 mb-1">{c?.isRecheck?'Это повторная проверка':'Аудит заблокирован'}</h2><p className="text-[12px] text-gray-500 mb-2">{c?.name}</p>{c?.isRecheck?<p className="text-[11px] text-cyan-600 mt-2">Для повторной проверки используйте экран Re-check.</p>:<><StatusB s={c?.status}/><p className="text-[11px] text-gray-400 mt-3">Редактирование недоступно в статусе «{ST[c?.status]?.l}».</p></>}<button onClick={()=>setPage(c?.isRecheck?'case_detail':'cases')} className="mt-4 px-5 py-2 bg-slate-800 text-white text-[12px] font-bold rounded-lg">{c?.isRecheck?'К кейсу':'К кейсам'}</button></div></div>;

  const pkgBlocks=PKG[c?.pkg]?.blocks||['fire','san','ot'];
  const[ab,sAB]=useState(pkgBlocks[0]);
  const[ans,sAns]=useState(()=>c?.status==='audit_ip'?{f1:'yes',f2:'yes',f3:'yes',f5:'no',f7:'no',f9:'yes',f12:'no',f13:'no',f14:'yes',s1:'yes',s8:'no',s9:'yes',s10:'partial'}:c?.status==='revision'?{f1:'yes',f2:'yes',f3:'yes',f4:'yes',f5:'no',f6:'no',f7:'no',f8:'yes',f9:'yes',f10:'yes',f11:'yes',f12:'no',f13:'no',f14:'yes',f15:'yes',s1:'yes',s2:'yes',s3:'yes',s4:'yes',s5:'yes',s6:'yes',s7:'yes',s8:'no',s9:'yes',s10:'partial',s11:'yes',s12:'yes',s13:'yes',s14:'yes',s15:'yes',o1:'yes',o2:'yes',o3:'yes',o4:'yes',o5:'no',o6:'yes',o7:'no',o8:'yes',o9:'yes',o10:'yes',o11:'yes',o12:'yes'}:{});
  const[pht,sPht]=useState(()=>c?.status==='audit_ip'?{f5:1,f14:1}:c?.status==='revision'?{f5:1,f6:1,f7:1,f8:1,f12:1,f14:1,f15:1,s3:1,s7:1,s8:1,s9:1,s10:1,s11:1,s14:1,o10:1,o11:1}:{});
  const[cmt,sCmt]=useState(()=>c?.status==='audit_ip'?{f5:'Проход частично перекрыт коробками',f7:'План не обновлён после перепланировки 2025',f12:'ОП-4: срок перезарядки истёк 4 мес., акт отсутствует',f13:'Акт перезарядки отсутствует',s8:'Мясо и молочная продукция в одном отсеке',s10:'3 контейнера без маркировки: нет наименования, даты, срока'}:c?.status==='revision'?{f5:'Проход перекрыт коробками',f6:'Запасной выход — замок без ключа у персонала',f7:'План не обновлён',f12:'ОП-4: срок истёк',f13:'Акт нет',s8:'Нарушение товарного соседства в холодильной камере',s10:'3 контейнера без маркировки',o5:'Журнал инструктажа на рабочем месте отсутствует',o7:'5 из 7 инструкций ОТ не пересматривались >2 лет'}:{});
  const[showV,sSV]=useState(false);const[submitted,sSub]=useState(false);
  const items=allItems(pkgBlocks);const bl=CL[ab];if(!bl)return null;
  const aC=items.filter(i=>ans[i.id]).length;const tP=Math.round((aC/items.length)*100);
  const bItems=bk=>{const r=[];CL[bk]?.sections.forEach(s=>s.items.forEach(i=>r.push(i)));return r};
  const bProg=bk=>{const it=bItems(bk);return it.length?Math.round((it.filter(i=>ans[i.id]).length/it.length)*100):0};
  const isRev=c?.status==='revision';
  /* #3: strict validation */
  const getErrs=()=>{const e=[];items.forEach(i=>{if(!ans[i.id])e.push({id:i.id,type:'answer',text:i.text,block:i.block});if(i.photo&&!pht[i.id])e.push({id:i.id,type:'photo',text:i.text,block:i.block});if((ans[i.id]==='no'||ans[i.id]==='partial')&&!cmt[i.id])e.push({id:i.id,type:'comment',text:i.text,block:i.block})});return e};
  const errs=getErrs();const canSub=errs.length===0;
  const doSubmit=()=>{if(!canSub)return;sSub(true);if(c)updateCase(c.id,{status:'pending_v',compl:100})};
  const goErr=e=>{sAB(e.block);sSV(false);setTimeout(()=>{const el=document.getElementById('it-'+e.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},100)};
  /* #4: jump to first revision item */
  const jumpToFirstRev=()=>{if(!c?.revItems?.length)return;const first=c.revItems[0];const item=items.find(i=>i.id===first);if(item){sAB(item.block);setTimeout(()=>{const el=document.getElementById('it-'+first);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},100)}};
  /* #5: dynamic AI based on actual answers */
  const aiWarnings=[];items.forEach(i=>{if(ans[i.id]==='no'&&!pht[i.id]&&i.photo)aiWarnings.push({type:'error',msg:`${i.id.toUpperCase()}: ответ «Нет» — нет фото-подтверждения нарушения`});if(ans[i.id]==='partial'&&!cmt[i.id])aiWarnings.push({type:'warning',msg:`${i.id.toUpperCase()}: ответ «Частично» — добавьте комментарий`})});
  if(ans.f12==='no')aiWarnings.push({type:'warning',msg:'F12: 80% кафе — огнетушители просрочены. Фотографируйте маркировку крупным планом (ПП РФ 1479, до 30 000₽)'});
  if(ans.s8==='no')aiWarnings.push({type:'warning',msg:'S8: 73% общепита — нарушение товарного соседства (ТР ТС 021/2011, до 50 000₽)'});
  if(ans.f5==='no')aiWarnings.push({type:'error',msg:'F5: Загромождение эвакуационного пути — приостановление до 90 суток (СП 1.13130.2020)'});

  if(submitted)return<div className="flex-1 flex items-center justify-center bg-gray-50 p-5 fade-in"><div className="text-center max-w-sm"><div className="w-14 h-14 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-3">{ic.checkCir({size:28,className:'text-emerald-600'})}</div><h2 className="text-lg font-extrabold text-slate-800 mb-1">Отправлено на проверку</h2><p className="text-[12px] text-gray-500 mb-4">{c?.name}</p><StatusB s="pending_v"/><button onClick={()=>setPage('dashboard')} className="mt-5 px-5 py-2 bg-slate-800 text-white text-[12px] font-bold rounded-lg">На главную</button></div></div>;

  return(<div className="flex flex-1 overflow-hidden">
    {/* LEFT */}
    <div className="w-[200px] bg-white border-r border-gray-200/80 flex-shrink-0 flex flex-col"><div className="p-3 border-b border-gray-100"><button onClick={()=>setPage('cases')} className="flex items-center gap-1 text-[10px] text-gray-400 hover:text-gray-600 mb-1">{ic.chevL({size:12})} Назад</button><h3 className="text-[12px] font-bold text-slate-800 leading-tight">{c?.name}</h3><div className="flex items-center gap-2 mt-1"><PkgB p={c?.pkg}/><StatusB s={c?.status}/></div></div><div className="p-3 border-b border-gray-100"><div className="flex items-center justify-between mb-1"><span className="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Прогресс</span><span className="text-[12px] font-black text-slate-800">{tP}%</span></div><PBar v={tP} h={7}/><p className="text-[9px] text-gray-400 mt-1">{aC}/{items.length}</p></div>
      {/* #4: jump to revision button */}
